name: Android ARM64 fiber proof of concept

on:
  push:
    branches:
      - nizar-crash3-android-poc
    paths:
      - "ANDROID_POC.md"
      - "android-poc/**"
      - ".github/workflows/android-fiber-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android native library (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout this proof-of-concept branch
        uses: actions/checkout@v4

      - name: Checkout the exact PSXRecomp revision used by Warped
        uses: actions/checkout@v4
        with:
          repository: Alexbeav/psxrecomp
          ref: 578bd3bedd48e2403a5d3de1cdc3eb260065ed7d
          path: psxrecomp
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK for Android ABIs
        working-directory: android-poc
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native libraries in APK
        run: |
          APK="android-poc/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libpsx_fiber_poc.so" apk-contents.txt

      - name: Upload proof-of-concept APK
        uses: actions/upload-artifact@v4
        with:
          name: nizar-crash3-android-fiber-poc
          path: android-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  qemu-test:
    name: Verify AArch64 fiber switching under QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout this proof-of-concept branch
        uses: actions/checkout@v4

      - name: Checkout the exact PSXRecomp revision used by Warped
        uses: actions/checkout@v4
        with:
          repository: Alexbeav/psxrecomp
          ref: 578bd3bedd48e2403a5d3de1cdc3eb260065ed7d
          path: psxrecomp
          persist-credentials: false

      - name: Install AArch64 cross compiler and QEMU user emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user

      - name: Build and run AArch64 fiber smoke test
        run: |
          aarch64-linux-gnu-gcc \
            -std=c11 -O2 -Wall -Wextra -static \
            -DPSX_FIBER_ALLOW_HOST_TEST=1 \
            -I psxrecomp/runtime/include \
            android-poc/app/src/main/cpp/psx_fiber_android.c \
            android-poc/app/src/main/cpp/psx_fiber_aarch64.S \
            android-poc/fiber_smoke_host.c \
            -o fiber-smoke-aarch64
          qemu-aarch64 ./fiber-smoke-aarch64
