name: Android ARM64 fiber proof of concept

on:
  push:
    branches:
      - nizar-crash3-android-poc
    paths:
      - "ANDROID_POC.md"
      - "android-poc/**"
      - ".github/workflows/android-fiber-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android native library (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout this proof-of-concept branch
        uses: actions/checkout@v4

      - name: Checkout the exact PSXRecomp revision used by Warped
        uses: actions/checkout@v4
        with:
          repository: Alexbeav/psxrecomp
          ref: 578bd3bedd48e2403a5d3de1cdc3eb260065ed7d
          path: psxrecomp
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK for Android ABIs
        working-directory: android-poc
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native libraries in APK
        run: |
          APK="android-poc/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          grep -q "lib/arm64-v8a/libpsx_fiber_poc.so" apk-contents.txt

      - name: Upload proof-of-concept APK
        uses: actions/upload-artifact@v4
        with:
          name: nizar-crash3-android-fiber-poc
          path: android-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  runtime-test:
    name: Run ARM64 fiber smoke test on Android 15 emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download proof-of-concept APK
        uses: actions/download-artifact@v4
        with:
          name: nizar-crash3-android-fiber-poc
          path: artifacts

      - name: Run ARM64 APK with Android 15 native-bridge support
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euo pipefail
            echo "Emulator ABI: $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo "Native bridge: $(adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r')"
            adb install artifacts/app-debug.apk
            adb logcat -c
            adb shell am force-stop net.kulthx.nizarcrash3poc || true
            adb shell am start -n net.kulthx.nizarcrash3poc/.MainActivity
            sleep 8
            adb logcat -d -s FIBER_POC:I AndroidRuntime:E '*:S' | tee fiber-test.log
            grep -q "PASS: Android AArch64 fiber switching and stack preservation" fiber-test.log
