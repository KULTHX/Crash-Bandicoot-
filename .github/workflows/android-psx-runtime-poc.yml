name: Crash 3 Android startup validation

on:
  push:
    branches:
      - nizar-crash3-android-poc
    paths:
      - "android-runtime-poc/**"
      - ".github/workflows/android-psx-runtime-poc.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android launcher/runtime (ARM64 + x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Crash 3 Android branch
        uses: actions/checkout@v4

      - name: Checkout PSXRecomp Android framework
        uses: actions/checkout@v4
        with:
          repository: dguillot-gh/psxrecomp-android
          ref: android
          path: psxrecomp
          persist-credentials: false

      - name: Checkout matching SDL3 Android sources
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.10
          path: SDL
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Enable OpenBIOS disc boot and migrate existing imports
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("psxrecomp/runtime/android/java/com/psxrecomp/android/LauncherActivity.java")
          source = path.read_text()
          old = """    private void startGame() {
                  if (!hasGame() || importing) return;
                  startActivity(new Intent(this, PsxGameActivity.class));
              }"""
          new = """    private void startGame() {
                  if (!hasGame() || importing) return;
                  int readyId = getResources().getIdentifier("psx_game_ready", "bool", getPackageName());
                  if (readyId == 0 || !getResources().getBoolean(readyId)) {
                      new AlertDialog.Builder(this)
                              .setTitle("Crash 3 build is not ready")
                              .setMessage("Disc boot is disabled in this build. Install the Android OpenBIOS preview build to start an imported disc.")
                              .setPositiveButton("OK", null)
                              .show();
                      return;
                  }
                  startActivity(new Intent(this, PsxGameActivity.class));
              }"""
          if old not in source:
              raise SystemExit("Expected LauncherActivity.startGame() block was not found; refusing an unsafe build.")
          path.write_text(source.replace(old, new, 1))

          # The launcher preserves app-private files across APK updates. Migrate
          # an already-imported game.toml before SDL starts so old installs use
          # bundled OpenBIOS and skip its startup animation before disc launch.
          game_path = Path("psxrecomp/runtime/android/java/com/psxrecomp/android/PsxGameActivity.java")
          game_source = game_path.read_text()
          needle = "        super.onCreate(state);"
          replacement = """        // Migrate existing imported games to this APK's bundled OpenBIOS policy.
                  File configFile = new File(getFilesDir(), "game.toml");
                  if (configFile.isFile()) {
                      try {
                          String oldConfig = PsxFiles.readText(configFile);
                          String newConfig = oldConfig
                                  .replace("openbios = false", "openbios = true")
                                  .replace("bios_hle = false", "bios_hle = true")
                                  .replace("path = \\"bios/SCPH1001.BIN\\"", "path = \\"bios/openbios.bin\\"");
                          if (!newConfig.equals(oldConfig)) PsxFiles.writeText(configFile, newConfig);
                      } catch (IOException e) {
                          Toast.makeText(this, "Could not update game BIOS mode: " + e.getMessage(),
                                  Toast.LENGTH_LONG).show();
                      }
                  }
                  super.onCreate(state);"""
          if needle not in game_source:
              raise SystemExit("Expected PsxGameActivity.onCreate() call was not found; refusing to skip config migration.")
          game_path.write_text(game_source.replace(needle, replacement, 1))
          PY

      - name: Verify Android disc-boot configuration
        run: |
          grep -q 'openbios = true' android-runtime-poc/app/src/main/assets/game.toml.in
          grep -q 'bios_hle = true' android-runtime-poc/app/src/main/assets/game.toml.in
          grep -q 'path = "bios/openbios.bin"' android-runtime-poc/app/src/main/assets/game.toml.in
          grep -q 'psx_game_ready">true' android-runtime-poc/app/src/main/res/values/bools.xml

      - name: Package redistributable OpenBIOS assets
        run: |
          mkdir -p android-runtime-poc/app/src/main/assets/bios
          cp psxrecomp/bios/openbios.bin android-runtime-poc/app/src/main/assets/bios/openbios.bin
          cp psxrecomp/bios/OpenBIOS.LICENSE android-runtime-poc/app/src/main/assets/bios/OpenBIOS.LICENSE

      - name: Build Android APK
        working-directory: android-runtime-poc
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify both Android ABIs and launcher resources
        run: |
          APK="android-runtime-poc/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | tee crash3-android-apk-contents.txt
          grep -q "lib/arm64-v8a/libmain.so" crash3-android-apk-contents.txt
          grep -q "lib/x86_64/libmain.so" crash3-android-apk-contents.txt
          grep -q "assets/bios/openbios.bin" crash3-android-apk-contents.txt
          grep -q "assets/game.toml.in" crash3-android-apk-contents.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q "com.psxrecomp.android.LauncherActivity"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: crash3-android-launcher-runtime
          path: android-runtime-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  runtime-test:
    name: Install and launch on Android 15 emulator
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: crash3-android-launcher-runtime
          path: artifacts

      - name: Launch launcher activity and check process remains alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics
          disable-animations: true
          script: |
            set -eu
            adb install -r artifacts/app-debug.apk
            adb logcat -c
            adb shell am force-stop net.kulthx.nizarcrash3recomp.bootfix || true
            adb shell am start -W -n net.kulthx.nizarcrash3recomp.bootfix/com.psxrecomp.android.LauncherActivity
            sleep 8
            adb shell pidof net.kulthx.nizarcrash3recomp.bootfix
            adb logcat -d -v threadtime > android-runtime-logcat.txt
            ! grep -E -i "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|Abort message" android-runtime-logcat.txt
            grep -E "Window\\{.*net.kulthx.nizarcrash3recomp.bootfix/com.psxrecomp.android.LauncherActivity|Start proc .*net.kulthx.nizarcrash3recomp.bootfix" android-runtime-logcat.txt

      - name: Save emulator startup log for inspection
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '.ci-results/android-runtime-startup.txt';
            const header = [
              'Crash 3 Android launcher startup diagnostic',
              'Run: ' + process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
              'Commit: ' + context.sha,
              ''
            ].join('\n');
            const log = fs.existsSync('android-runtime-logcat.txt')
              ? fs.readFileSync('android-runtime-logcat.txt', 'utf8')
              : 'No emulator logcat file was produced.';
            const body = Buffer.from(header + log.slice(-180000)).toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'nizar-crash3-android-poc'
              });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Save Android launcher startup diagnostic',
              content: body,
              branch: 'nizar-crash3-android-poc',
              ...(sha ? { sha } : {})
            });
