plugins {
    id "com.android.application"
}
android {
    namespace "net.kulthx.nizarcrash3sdl"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "net.kulthx.nizarcrash3sdl"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                arguments "-DSDL_ROOT=${rootProject.projectDir}/../SDL"
                arguments "-DSDL_SHARED=ON", "-DSDL_STATIC=OFF"
                cFlags "-std=c11"
            }
        }
    }
    sourceSets {
        main {
            java.srcDirs += ["${rootProject.projectDir}/../SDL/android-project/app/src/main/java"]
        }
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
