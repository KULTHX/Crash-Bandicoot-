plugins {
    id "com.android.application"
}

android {
    namespace "net.kulthx.nizarcrash3poc"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "net.kulthx.nizarcrash3poc"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DPSXRECOMP_ROOT=${rootProject.projectDir}/../psxrecomp"
                cFlags "-std=c11"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}
