plugins {
    id "com.android.application"
}

android {
    namespace "net.kulthx.nizarcrash3recomp"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "net.kulthx.nizarcrash3recomp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.2.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DPSXRECOMP_ROOT=${rootProject.projectDir}/../psxrecomp"
                arguments "-DPSX_SDL_BACKEND=SDL3"
                cppFlags "-std=c++17"
                cFlags "-std=c11"
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${rootProject.projectDir}/../SDL/android-project/app/src/main/java"]
        }
    }

    externalNativeBuild {
        cmake {
            path file("${rootProject.projectDir}/CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
