plugins {
    id "com.android.application"
}

android {
    namespace "net.kulthx.nizarcrash3recomp"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "net.kulthx.nizarcrash3recomp.bootfix"
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName "0.4.3-android-openbios-bootfix-preview"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                arguments "-DPSXRECOMP_ROOT=${rootProject.projectDir}/../psxrecomp"
                arguments "-DPSX_SDL_BACKEND=SDL3"
                arguments "-DPSX_SDL3_FETCH=ON"
                cppFlags "-std=c++17"
                cFlags "-std=c11"
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += [
                "${rootProject.projectDir}/../SDL/android-project/app/src/main/java",
                "${rootProject.projectDir}/../psxrecomp/runtime/android/java"
            ]
        }
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
